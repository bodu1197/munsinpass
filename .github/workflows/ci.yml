name: CI

on:
  push:
    branches: [main]
  pull_request:

# 동시 실행 중복 취소(같은 ref)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # 빌드는 비밀키 없이도 동작(graceful degradation). 절대 URL만 라이브 도메인으로.
          NEXT_PUBLIC_SITE_URL: https://munsinpass.vercel.app
